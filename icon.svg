<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH 护眼配色包">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ee"/>
      <stop offset="1" stop-color="#f1e8d8"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98a52"/>
      <stop offset="1" stop-color="#a86234"/>
    </linearGradient>
  </defs>

  <!-- 纸张底 -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#paper)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="#d8c6a6" stroke-opacity=".7"/>

  <!-- 暖阳 -->
  <circle cx="32" cy="27" r="10" fill="url(#sun)"/>
  <!-- 光线：四向短线，呼应“低蓝光/柔光” -->
  <g stroke="#b8763f" stroke-width="2.4" stroke-linecap="round" opacity=".75">
    <path d="M32 10v3.4"/>
    <path d="M32 40.6V44"/>
    <path d="M15 27h3.4"/>
    <path d="M45.6 27H49"/>
  </g>

  <!-- 三档配色条：代表五套配色可选 -->
  <g>
    <rect x="16" y="47" width="10" height="4" rx="2" fill="#b5713f"/>
    <rect x="27" y="47" width="10" height="4" rx="2" fill="#9a6b2f"/>
    <rect x="38" y="47" width="10" height="4" rx="2" fill="#577138"/>
  </g>
</svg>
